<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뷰어 QR 코드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600&family=Sora:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{ --ground:#0E1013; --ink:#F2F3F5; --dim:#8A9099; --line:#262A30; --paper:#FFFFFF; --print:#0E1013; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
        background:var(--ground); color:var(--ink); font-family:"Gothic A1",sans-serif; padding:24px 16px; }
  .card{ width:min(360px, 100%); background:var(--paper); color:var(--print); border-radius:20px; padding:28px 28px 22px; text-align:center; }
  .card svg{ display:block; width:100%; height:auto; }
  .name{ margin:18px 0 2px; font:600 17px/1.3 "Gothic A1",sans-serif; letter-spacing:-.01em; }
  .hint{ margin:0; font-size:13px; color:#5B616B; }
  .url{ margin:14px 0 0; font:300 11px/1.3 "Sora",sans-serif; color:#8A9099; word-break:break-all; }
  .bar{ display:flex; gap:8px; }
  button{ font:500 13px "Gothic A1",sans-serif; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:9px 18px; cursor:pointer; }
  button:hover{ border-color:var(--dim); }
  body.only{ background:#fff; padding:0; min-height:0; height:100vh; }
  body.only .bar{ display:none; }
  @media print{ body{ background:#fff; } .bar{ display:none; } .card{ border:1px solid #ddd; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div id="qr" role="img" aria-label="뷰어 주소 QR 코드"></div>
    <p class="name">케이블 단면 3D 뷰어</p>
    <p class="hint">휴대폰 카메라로 찍으면 바로 열립니다</p>
    <p class="url" id="url"></p>
  </div>
  <div class="bar">
    <button type="button" id="print">인쇄</button>
    <button type="button" id="save">이미지 저장</button>
  </div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
// QR이 가리키는 주소. 보고를 새로 게시해도 주소는 같으므로 QR은 다시 만들 필요 없음.
const SITE = 'https://flowerpig4029473.github.io/cable-viewer/';
if (new URLSearchParams(location.search).has('only')) document.body.classList.add('only');

const qr = qrcode(0, 'M');
qr.addData(SITE);
qr.make();
const n = qr.getModuleCount(), q = 2, size = n + q * 2;
let path = '';
for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) path += `M${c + q} ${r + q}h1v1h-1z`;
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${path}" fill="#0E1013"/></svg>`;
document.getElementById('qr').innerHTML = svg;
document.getElementById('url').textContent = SITE;

document.getElementById('print').onclick = () => print();
document.getElementById('save').onclick = () => {
  const img = new Image(), px = 1024;
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = px;
    const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, px, px);
    cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '케이블뷰어_QR.png'; a.click(); });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
</script>
</body>
</html>
